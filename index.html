<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cinzel for main brand + product titles -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Merriweather:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Oswald for section titles -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Old Ironsides Coffee</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-emblem.png"
    />
    <link rel="icon" href="/favicon-emblem.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script async src="https://auth.govx.com/js/govxid.js"></script>

    <!-- Tidio chat widget control -->
    <script>
      window.tidioChatApi = window.tidioChatApi || [];
      window.tidioChatApi.push({
        on: "ready",
        callback: function () {
          // Force widget to stay closed on load
          window.tidioChatApi.hide();
        },
      });

      window.tidioChatApi.push({
        on: "open",
        callback: function () {
          try {
            window.tidioChatApi.openTab("home");
          } catch (e) {}
        },
      });
    </script>

    <!-- Tidio chat widget -->
    <script
      src="//code.tidio.co/fvua8pqirxw8egpkw9ey3bsc9q0o9v7o.js"
      async
    ></script>
  </body>
</html>
